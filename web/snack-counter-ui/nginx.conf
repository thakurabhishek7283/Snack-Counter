server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the .NET container. Receipts are uploaded through here, so allow ~10 MB bodies.
  location /api/ {
    proxy_pass http://api:8080;
    # nginx defaults to HTTP/1.0 upstream; Kestrel rejects a bodiless HTTP/1.0 POST (e.g. "commit") with 400.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }

  location = /health {
    proxy_pass http://api:8080/health;
  }

  # Hashed build output can be cached for a long time; index.html must not be.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/refills/..., /report) all serve the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
